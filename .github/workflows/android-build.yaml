name: 'Android build'

on:
  pull_request:
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/android-build.yaml'
  push:
    branches: ['main']
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/android-build.yaml'
  workflow_dispatch:

permissions:
  contents: 'read'

jobs:
  build:
    name: 'Build Android development APK'
    runs-on: 'ubuntu-latest'
    timeout-minutes: 45
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@v7.0.1'
        with:
          lfs: true

      - name: 'Free disk space for Unity'
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune --all --force
          df -h

      - name: 'Cache Unity Library'
        uses: 'actions/cache@v6.1.0'
        with:
          path: 'Library'
          key: Library-${{ runner.os }}-Android-6000.6.5f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ runner.os }}-Android-6000.6.5f1-

      - name: 'Build Android development APK'
        uses: 'game-ci/unity-builder@eb1b9fba120c6e62c9fb7a7a81d6c107ce004c45' # v6.0.0
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: '6000.6.5f1'
          targetPlatform: 'Android'
          buildMethod: 'Asterforge.Editor.AndroidBuild.BuildFromCommandLine'

      - name: 'Upload Android development APK'
        uses: 'actions/upload-artifact@v7.0.2'
        with:
          name: 'asterforge-android-development'
          path: 'build/Android/asterforge.apk'
          if-no-files-found: 'error'
