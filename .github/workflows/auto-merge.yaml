name: 'Dependabot Auto-Merge'

on:
  pull_request_target:
    types: ['opened', 'reopened', 'synchronize', 'ready_for_review']
  workflow_run:
    workflows: ['Unity tests']
    types: ['completed']

permissions:
  contents: 'write'
  pull-requests: 'write'

jobs:
  approve:
    # 49699333 is the GitHub.com account ID for dependabot[bot].
    if: github.event_name == 'pull_request_target' && github.event.sender.id == 49699333 && github.event.pull_request.user.id == 49699333 && github.event.pull_request.head.repo.id == github.event.repository.id
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Fetch Dependabot metadata'
        uses: 'dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: 'Approve PR'
        run: |
          gh pr review "$PR_URL" --approve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}

  merge:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Merge tested Dependabot PR'
        run: |
          if [ -z "$PR_NUMBER" ]; then
            exit 0
          fi

          PR_DETAILS="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          if ! jq -e --argjson repository_id "$REPOSITORY_ID" '.user.id == 49699333 and .head.repo.id == $repository_id and .base.repo.id == $repository_id' <<< "$PR_DETAILS" > /dev/null; then
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --rebase --match-head-commit "$TESTED_HEAD_SHA" --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY_ID: ${{ github.repository_id }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          TESTED_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
