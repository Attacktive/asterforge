name: 'Unity tests'

on:
	pull_request:
	push:
		branches: ['main']
	workflow_dispatch:

permissions:
	contents: 'read'
	checks: 'write'

jobs:
	test:
		name: 'Compile and run EditMode tests'
		runs-on: 'ubuntu-latest'
		timeout-minutes: 30
		steps:
			- name: 'Checkout repository'
				uses: actions/checkout@v7.0.1
				with:
					lfs: true

			- name: 'Cache Unity Library'
				uses: actions/cache@v6.1.0
				with:
					path: 'Library'
					key: Library-${{ runner.os }}-6000.6.5f1-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
					restore-keys: |
						Library-${{ runner.os }}-6000.6.5f1-

			- name: 'Compile and run EditMode tests'
				id: 'tests'
				uses: game-ci/unity-test-runner@v4.4.0
				env:
					UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
					UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
					UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
				with:
					unityVersion: '6000.6.5f1'
					testMode: 'editmode'
					githubToken: ${{ secrets.GITHUB_TOKEN }}
					checkName: 'Unity EditMode tests'

			- name: 'Upload test results'
				if: always()
				uses: actions/upload-artifact@v7.0.1
				with:
					name: 'unity-editmode-results'
					path: ${{ steps.tests.outputs.artifactsPath }}
					if-no-files-found: 'ignore'
